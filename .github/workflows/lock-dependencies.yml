name: Refresh Dependency Lock

on:
  push:
    branches:
      - security-hardening-macos
    paths:
      - "requirements.in"
      - ".github/workflows/lock-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.6.2
          python -m piptools compile             --resolver=backtracking             --generate-hashes             --strip-extras             --output-file=requirements.lock             requirements.in
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Commit lock file when changed
        shell: bash
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "requirements.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          git commit -m "build: refresh hashed dependency lock [skip ci]"
          git push
