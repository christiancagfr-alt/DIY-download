name: Build Smoke Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          if (Test-Path "requirements-build.lock") {
            python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
          } else {
            python -m pip install --disable-pip-version-check -r requirements_google.txt
            python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          }
          python -m pip check

      - name: Compile
        run: python -m compileall -q .

      - name: Build Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name "DIYDownloader" --icon "logo.ico" --add-data "assets;assets" --add-data "logo.png;." --add-data "logo.ico;." --hidden-import "yt_dlp" --collect-all "yt_dlp" --hidden-import "version" --hidden-import "updater" --hidden-import "env_tools" --hidden-import "video_batch_downloader" --hidden-import "drive_batch_uploader" --hidden-import "paste_link_download_page" "sheets_batch_downloader_modern.py"
          if (-not (Test-Path "dist\DIYDownloader\DIYDownloader.exe")) { throw "Windows build missing executable" }

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target_arch: arm64
          - runner: macos-15-intel
            target_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: bash
        run: |
          if [ -s requirements-build.lock ]; then
            python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
          else
            python -m pip install --disable-pip-version-check -r requirements_google.txt
            python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          fi
          python -m pip check

      - name: Compile
        run: python -m compileall -q .

      - name: Build macOS app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --noupx --target-arch "${{ matrix.target_arch }}" --name "DIYDownloader" --add-data "assets:assets" --add-data "logo.png:." --hidden-import "yt_dlp" --collect-all "yt_dlp" --hidden-import "version" --hidden-import "updater" --hidden-import "env_tools" --hidden-import "video_batch_downloader" --hidden-import "drive_batch_uploader" --hidden-import "paste_link_download_page" "sheets_batch_downloader_modern.py"
          test -d "dist/DIYDownloader.app"
