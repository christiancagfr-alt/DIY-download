name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v1.6.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag and lock files
        shell: bash
        run: |
          case "${RELEASE_TAG}" in
            v[0-9]*) ;;
            *) echo "Release tag must start with v followed by a number"; exit 1 ;;
          esac
          test -s requirements.lock
          test -s requirements-build.lock

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Compile source
        run: python -m compileall -q .

      - name: Install audit tools
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1 bandit==1.9.4

      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock

      - name: High-severity static audit
        run: bandit -r . -x ./.git,./.venv,./venv,./build,./dist,./release -lll

      - name: Project security policy
        run: python scripts/security_checks.py .

  build-windows:
    name: Build Windows
    needs: security
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install hash-locked build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
          python -m pip check

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $raw = Get-Content "version.py" -Raw
          if ($raw -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $v = $Matches[1]
          } else {
            throw "APP_VERSION not found"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows onedir
        shell: pwsh
        run: |
          python -m PyInstaller             --noconfirm             --clean             --onedir             --windowed             --noupx             --name "DIYDownloader"             --icon "logo.ico"             --add-data "assets;assets"             --add-data "logo.png;."             --add-data "logo.ico;."             --hidden-import "yt_dlp"             --collect-all "yt_dlp"             --hidden-import "version"             --hidden-import "updater"             --hidden-import "env_tools"             --hidden-import "video_batch_downloader"             --hidden-import "drive_batch_uploader"             --hidden-import "paste_link_download_page"             "sheets_batch_downloader_modern.py"

          if (-not (Test-Path "dist\DIYDownloader\DIYDownloader.exe")) {
            throw "onedir build missing dist\DIYDownloader\DIYDownloader.exe"
          }

          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          $zipPath = "release\DIYDownloader-$env:RELEASE_TAG-windows.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "dist\DIYDownloader\*" -DestinationPath $zipPath -Force

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "ISCC.exe not found"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $srcDir = (Resolve-Path "dist\DIYDownloader").Path
          $outDir = (Resolve-Path ".").Path + "\release"
          & $iscc             "/DMyAppVersion=$ver"             "/DMyAppSourceDir=$srcDir"             "/O$outDir"             "/FDIYDownloader-$env:RELEASE_TAG-windows-setup"             "installer\diy_downloader.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          if (-not (Get-ChildItem "release\*setup*.exe" | Select-Object -First 1)) {
            throw "Installer not produced"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            release/DIYDownloader-${{ env.RELEASE_TAG }}-windows.zip
            release/DIYDownloader-${{ env.RELEASE_TAG }}-windows-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target_arch: arm64
          - runner: macos-15-intel
            arch: x64
            target_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate Apple signing secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          for var in             APPLE_CERTIFICATE_P12_BASE64             APPLE_CERTIFICATE_PASSWORD             APPLE_SIGNING_IDENTITY             APPLE_ID             APPLE_TEAM_ID             APPLE_APP_PASSWORD
          do
            if [ -z "${!var}" ]; then
              echo "Required macOS signing/notarization secret is missing: $var"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/diy-build.keychain-db"
          KEYCHAIN_PASSWORD="diy-ephemeral-ci-keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Install hash-locked build dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
          python -m pip check

      - name: Build and sign macOS app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          python -m PyInstaller             --noconfirm             --clean             --windowed             --noupx             --target-arch "${{ matrix.target_arch }}"             --codesign-identity "$APPLE_SIGNING_IDENTITY"             --name "DIYDownloader"             --add-data "assets:assets"             --add-data "logo.png:."             --hidden-import "yt_dlp"             --collect-all "yt_dlp"             --hidden-import "version"             --hidden-import "updater"             --hidden-import "env_tools"             --hidden-import "video_batch_downloader"             --hidden-import "drive_batch_uploader"             --hidden-import "paste_link_download_page"             "sheets_batch_downloader_modern.py"

          codesign --force --deep --options runtime --timestamp             --sign "$APPLE_SIGNING_IDENTITY" "dist/DIYDownloader.app"
          codesign --verify --deep --strict --verbose=2 "dist/DIYDownloader.app"

      - name: Notarize and staple macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          NOTARY_ZIP="$RUNNER_TEMP/DIYDownloader-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/DIYDownloader.app" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP"             --apple-id "$APPLE_ID"             --password "$APPLE_APP_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait
          xcrun stapler staple "dist/DIYDownloader.app"
          xcrun stapler validate "dist/DIYDownloader.app"
          spctl --assess --type execute --verbose=2 "dist/DIYDownloader.app"

      - name: Package macOS app
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent             "dist/DIYDownloader.app"             "release/DIYDownloader-${RELEASE_TAG}-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/DIYDownloader-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Attest and Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "release/*"

      - name: Create release in personal repository
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: "release/*"
          name: "DIY下载器 ${{ env.RELEASE_TAG }}"
          body_path: release_notes.md
          generate_release_notes: true
