name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v1.6.0). Leave empty to use current ref."
        required: false
        default: ""

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
  PYINSTALLER_VERSION: "6.22.3"
  INNO_VERSION: "6.7.1"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements_google.txt
          python -m pip install --disable-pip-version-check "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
          python -m pip check

      - name: Compile
        run: python -m compileall -q .

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $raw = Get-Content "version.py" -Raw
          if ($raw -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $v = $Matches[1]
          } else {
            $v = "${{ env.RELEASE_TAG }}".TrimStart("v")
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows onedir
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --noupx `
            --name "DIYDownloader" `
            --icon "logo.ico" `
            --add-data "assets;assets" `
            --add-data "logo.png;." `
            --add-data "logo.ico;." `
            --hidden-import "yt_dlp" `
            --collect-all "yt_dlp" `
            --hidden-import "version" `
            --hidden-import "updater" `
            --hidden-import "env_tools" `
            --hidden-import "video_batch_downloader" `
            --hidden-import "drive_batch_uploader" `
            --hidden-import "paste_link_download_page" `
            "sheets_batch_downloader_modern.py"

          if (-not (Test-Path "dist\DIYDownloader\DIYDownloader.exe")) {
            throw "Windows build missing executable"
          }

          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          $zipPath = "release\DIYDownloader-${{ env.RELEASE_TAG }}-windows.zip"
          Compress-Archive -Path "dist\DIYDownloader\*" -DestinationPath $zipPath -Force

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version "${{ env.INNO_VERSION }}" -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $srcDir = (Resolve-Path "dist\DIYDownloader").Path
          $outDir = (Resolve-Path ".").Path + "\release"
          & $iscc `
            "/DMyAppVersion=$ver" `
            "/DMyAppSourceDir=$srcDir" `
            "/O$outDir" `
            "/FDIYDownloader-${{ env.RELEASE_TAG }}-windows-setup" `
            "installer\diy_downloader.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            release/DIYDownloader-${{ env.RELEASE_TAG }}-windows.zip
            release/DIYDownloader-${{ env.RELEASE_TAG }}-windows-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.target_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target_arch: arm64
          - runner: macos-15-intel
            target_arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require Apple signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements_google.txt
          python -m pip install --disable-pip-version-check "pyinstaller==${PYINSTALLER_VERSION}"
          python -m pip check

      - name: Compile
        run: python -m compileall -q .

      - name: Build macOS app
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --noupx \
            --target-arch "${{ matrix.target_arch }}" \
            --name "DIYDownloader" \
            --add-data "assets:assets" \
            --add-data "logo.png:." \
            --hidden-import "yt_dlp" \
            --collect-all "yt_dlp" \
            --hidden-import "version" \
            --hidden-import "updater" \
            --hidden-import "env_tools" \
            --hidden-import "video_batch_downloader" \
            --hidden-import "drive_batch_uploader" \
            --hidden-import "paste_link_download_page" \
            "sheets_batch_downloader_modern.py"
          test -d "dist/DIYDownloader.app"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/diy-signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CERT_PATH="$RUNNER_TEMP/diy-certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Sign macOS app
        shell: bash
        run: |
          set -euo pipefail
          codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "dist/DIYDownloader.app"
          codesign --verify --deep --strict --verbose=2 "dist/DIYDownloader.app"

      - name: Notarize and staple
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          PRE_ZIP="$RUNNER_TEMP/DIYDownloader-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/DIYDownloader.app" "$PRE_ZIP"
          xcrun notarytool submit "$PRE_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/DIYDownloader.app"
          xcrun stapler validate "dist/DIYDownloader.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/DIYDownloader.app" \
            "release/DIYDownloader-${{ env.RELEASE_TAG }}-macos-${{ matrix.target_arch }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.target_arch }}-release
          path: release/DIYDownloader-${{ env.RELEASE_TAG }}-macos-${{ matrix.target_arch }}.zip
          if-no-files-found: error

  release:
    name: Attest and Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -la release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "release/*"

      - name: Create personal-account release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: "release/*"
          name: "DIY下载器 ${{ env.RELEASE_TAG }}"
          body_path: release_notes.md
          generate_release_notes: true
